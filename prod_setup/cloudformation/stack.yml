AWSTemplateFormatVersion: "2010-09-09"
Description: WordPress on EC2 with RDS, CloudFront, and ACM SSL

Parameters:
  Environment:
    Type: String
    Description: Environment name (prd, dev)

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 KeyPair name

  DomainName:
    Type: String
    Description: Root domain (getgaur.com)

  ACMCertArn:
    Type: String
    Description: ACM certificate ARN from us-east-1

  DBName:
    Type: String
    Default: wordpress

  DBUser:
    Type: String

  DBPassword:
    Type: String
    NoEcho: true

  UbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/arm64/hvm/ebs-gp2/ami-id

Resources:

  # --------------------------
  # VPC
  # --------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  IGW:
    Type: AWS::EC2::InternetGateway

  IGWAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref IGW

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  Route:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGW

  RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  # --------------------------
  # Security Groups
  # --------------------------
  WebSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Web + SSH
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  DBSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS access from EC2
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref WebSG

  # --------------------------
  # RDS
  # --------------------------
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: WordPress DB subnet
      SubnetIds:
        - !Ref PublicSubnet

  WordPressDB:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      Engine: mariadb
      EngineVersion: "10.6"
      DBName: !Ref DBName
      MasterUsername: !Ref DBUser
      MasterUserPassword: !Ref DBPassword
      VPCSecurityGroups:
        - !Ref DBSG
      DBSubnetGroupName: !Ref DBSubnetGroup
      PubliclyAccessible: false

  # --------------------------
  # EC2 WordPress
  # --------------------------
  WordPressEC2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t4g.micro
      KeyName: !Ref KeyName
      ImageId: !Ref UbuntuAmi
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref WebSG
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          export DB_NAME=${DBName}
          export DB_USER=${DBUser}
          export DB_PASSWORD=${DBPassword}
          export DB_HOST=${WordPressDB.Endpoint.Address}
          export DB_CHARSET=utf8
          export DB_COLLATE=
          export WP_MEMORY_LIMIT=128M
          export WP_DEBUG=false
          export WP_HOME=https://${DomainName}
          export WP_SITEURL=https://${DomainName}

          curl -o /tmp/setup-wordpress.sh https://raw.githubusercontent.com/YOUR_REPO/setup-wordpress.sh
          chmod +x /tmp/setup-wordpress.sh
          /tmp/setup-wordpress.sh

  # --------------------------
  # CloudFront
  # --------------------------
  CloudFront:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.php
        Aliases:
          - getgaur.com
          - www.getgaur.com
        Origins:
          - DomainName: !GetAtt WordPressEC2.PublicDnsName
            Id: WPOrigin
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: WPOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        ViewerCertificate:
          AcmCertificateArn: !Ref ACMCertArn
          SslSupportMethod: sni-only

Outputs:
  EC2PublicIP:
    Value: !GetAtt WordPressEC2.PublicIp

  RDSHost:
    Value: !GetAtt WordPressDB.Endpoint.Address

  CloudFrontDomain:
    Value: !GetAtt CloudFront.DomainName
